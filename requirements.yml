---
functional:
# требуются дополнения по мере тестирования
  - Пользователи могут регистрироваться и авторизоваться на платформе
  - Два игрока могут одновременно решать одну задачу в режиме реального времени
  - Оба игрока видят код друг друга в редакторе в реальном времени
  - Игроки видят результаты тестов соперника по мере их запуска
  - Игрок может сменить язык программирования во время игры
  - Доступна игра против другого пользователя, бота или друга по ссылке
  - При создании игры можно выбрать уровень сложности задачи
  - Можно выбрать конкретную задачу или получить случайную
  - Задачи доступны на русском и английском языках
  - Другие пользователи могут наблюдать за ходом игры в режиме зрителя
  - В игре есть чат для зарегистрированных пользователей
  - Завершённые игры доступны для просмотра в записи
  - Игроки получают очки по результатам игр
  - Доступен рейтинг игроков за неделю, месяц и всё время

non-functional:
  - Сайт должен быть оптимизирован для скорости загрузки и работы
  - Сайт должен быть безопасным и защищать персональные данные пользователей
  - Сайт должен корректно работать на мобильных устройствах
  - Сайт должен быть совместим с последними версиями основных браузеров
  - Система должна поддерживать не менее 1000 одновременных пользователей
  - Синхронизация кода между игроками должна происходить с минимальной задержкой

implicit:
  - Интерфейс должен быть интуитивно понятным без необходимости читать документацию
  - Система должна корректно определять победителя по факту прохождения всех тестов
  - Игра должна корректно завершаться при отключении одного из участников
  - Платформа должна поддерживать несколько языков программирования
  - Исходный код проекта должен быть открытым и доступным для вклада сообщества
