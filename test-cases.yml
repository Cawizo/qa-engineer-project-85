---
# Главная страница
- id: TC-001
  summary: |
    Запуск "Простого боя" без регистрации
  requirement: |
    Пользователь может испытать функционал сражения без регистрации и входа в аккаунт
  prerequisites: |
    Открыта страницы сайта, вход не выполнен
  test-data: |
    Отсутствуют
  steps:
    - Нажимаем кнопку "Try simple battle"
  expected-result: |
    Пользователь должен попасть на страницу сражения
    
- id: TC-002
  summary: |
    Возвращение на главную страницу из "Простого боя"
  requirement: |
    Пользователь может вернуться на главную страницу из режима сражения
  prerequisites: |
    Вход не выполнен
    Открыта главная страница, нажата кнопка "Try simple battle"
  test-data: |
    Отсутствуют
  steps:
    - Нажимаем кнопку "Back to Home"
  expected-result: |
    Пользователь должен вернуться на главную страницу

- id: TC-003
  summary: |
    Просмотр записи после решения задачи в "Простом бою"
  requirement: |
    Пользователь может посмотреть запись матча после его завершения
  prerequisites: |
    Вход не выполнен
    Открыт режим Simple Battle
    Матч завершен
  test-data: |
    Отсутствуют
  steps:
    - Нажимаем кнопку "Open History"
    - Нажимаем кнопку "Play" на плеере
  expected-result: |
    Пользователь должен увидеть запись матча

- id: TC-004
  summary: |
    Возвращение в игру после просмотра записи матча
  requirement: |
    Пользователь может вернуться в игру после просмотра записи матча
  prerequisites: |
    Вход не выполнен
    Открыт режим Simple Battle
    Открыта запись матча
  test-data: |
    Отсутствуют
  steps:
    - Нажимаем кнопку "Back to Game" один раз
  expected-result: |
    Пользователь должен вернуться к игре 
    
- id: TC-005
  summary: |
    Повторное начало "Просто боя" после завершения первого
  requirement: |
    Пользователь может повторно попробовать "Простой бой" после завершения текущего
  prerequisites: |
    Вход не выполнен
    Открыт режим Simple Battle
    Матч завершен
  test-data: |
    Отсутствуют
  steps:
    - Нажимаем кнопку "Start simple battle" один раз
  expected-result: |
    Пользователь должен попасть в новое сражение

- id: TC-006
  summary: |
    Регистрация после "Простого боя"
  requirement: |
    Пользователь может зарегистрироваться после завершения матча
  prerequisites: |
    Вход не выполнен
    Открыт режим Simple Battle
    Задача решена
  test-data: |
    Отсутствуют
  steps:
    - Нажимаем кнопку "Sign Up" один раз
  expected-result: |
    Пользователь должен попасть на страницу регистрации


    
