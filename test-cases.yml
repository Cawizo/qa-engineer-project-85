    Пользователь может вернуться в игру после просмотра записи матча
  prerequisites: |
    Вход не выполнен
    Открыт режим Simple Battle
    Открыта запись матча
  test-data: |
    Отсутствуют
  steps:
    - Нажимаем кнопку "Back to Game" один раз
  expected-result: |
    Пользователь должен вернуться к игре 
    
- id: TC-005
  summary: |
    Повторное начало "Просто боя" после завершения первого
  requirement: |
    Пользователь может повторно попробовать "Простой бой" после завершения текущего
  prerequisites: |
    Вход не выполнен
    Открыт режим Simple Battle
    Матч завершен
  test-data: |
    Отсутствуют
  steps:
    - Нажимаем кнопку "Start simple battle" один раз
  expected-result: |
    Пользователь должен попасть в новое сражение

- id: TC-006
  summary: |
    Регистрация после "Простого боя"
  requirement: |
    Пользователь может зарегистрироваться после завершения матча
  prerequisites: |
    Вход не выполнен
    Открыт режим Simple Battle
    Задача решена
  test-data: |
    Отсутствуют
  steps:
    - Нажимаем кнопку "Sign Up" один раз
  expected-result: |
    Пользователь должен попасть на страницу регистрации

- id: TC-007
  summary: |
    Успешная регистрация нового пользователя с корректными данными
  requirement: |
    При вводе корректных данных для регистрации, пользователю высылается код верификации на указанную почту
  prerequisites: |
    Открыта главная страница проекта https://codebattle.hexlet.io/
  test-data: |
    Nickname = TestCawizo
    Используем новый адрес Email, который не был ранее зарегистрирован на сайте 
    Password = ***********
  steps: 
    - Нажимаем кнопку "Sign up" в шапке сайта
    - Заполняем тестовыми данными поля Nickname, Email, Password, Password Confirmation
    - Нажимаем кнопку "Submit"
  expected-result: |
    Пользователь перенаправляется на страницу "Sign In" с сообщением "We sent a verification email. Please confirm your email before signing in."

